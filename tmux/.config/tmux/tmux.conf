set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R
bind -n M-H previous-window
bind -n M-L next-window

bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '10'
# set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @tmux-fzf-launch-key 'C-f'
set -g @tmux-fzf-options '-p -w 62% -h 38% -m'

# Catppuccin Mocha colors across status/panes/messages.
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#313244,fg=#89b4fa'

# Status bar: active app/command + date/time with Catppuccin accents.
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 100
set -g status-left '#[fg=#89b4fa,bold] #S '
set -g status-right '#[fg=#a6adc8]#{?pane_in_mode,COPY,#{pane_current_command}} #[fg=#6c7086]| #[fg=#b4befe]%Y-%m-%d #[fg=#f9e2af]%H:%M'

# run-shell 'mkdir -p "$HOME/.local/share/tmux/resurrect"; if [ ! -e "$HOME/.local/share/tmux/resurrect/last" ]; then touch "$HOME/.local/share/tmux/resurrect/tmux_resurrect_bootstrap.txt"; ln -sfn "tmux_resurrect_bootstrap.txt" "$HOME/.local/share/tmux/resurrect/last"; fi'
run '~/.tmux/plugins/tpm/tpm'
